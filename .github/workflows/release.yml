name: Release & Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: rm -rf node_modules package-lock.json && npm install

      - name: Compile
        run: npm run compile

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Package VSIX
        run: npx vsce package -o singlestore-${{ steps.version.outputs.version }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.vsix"

      - name: Publish to VS Code Marketplace
        if: vars.PUBLISH_TO_MARKETPLACE == 'true'
        run: npx vsce publish -i singlestore-${{ steps.version.outputs.version }}.vsix -p ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        if: vars.PUBLISH_TO_OPENVSX == 'true'
        run: npx ovsx publish singlestore-${{ steps.version.outputs.version }}.vsix -p ${{ secrets.OVSX_PAT }}
